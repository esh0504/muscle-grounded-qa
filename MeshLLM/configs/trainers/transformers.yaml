name: transformers

output_dir: outputs

# Basic HF TrainingArguments
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
learning_rate: 5e-5
num_train_epochs: 1
logging_steps: 10
evaluation_strategy: "no"
save_strategy: "no"
report_to: null  # disable wandb/mlflow unless configured
seed: ${seed}
fp16: false


