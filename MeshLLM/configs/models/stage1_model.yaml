name: stage1.model
class_name: Stage1Model

# Stage-1: SpiralNet++ encoder + classification head → 11 muscle activations
template_obj: DATA/mesh/topology.obj
transform_cache: DATA/mesh/spiral_transform.pkl

in_channels: 3
out_channels: [16, 16]
ds_factors: [4, 4]
seq_lengths: [9, 9]
dilations: [1, 1]

latent_channels: 32   # encoder FC
hidden_channels: 32   # classification hidden
num_outputs: 11
dropout: 0.5
output_activation: sigmoid
